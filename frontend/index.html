    <script type="application/ld+json">

    <script>
      (function () {
        // Every page is now redesigned for both themes, so a new
        // visitor's own OS preference decides the default; the
        // toggle (lib/theme.js) overrides and persists from there.
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
