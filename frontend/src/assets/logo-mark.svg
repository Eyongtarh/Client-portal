<svg viewBox="35 5 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(20, 0)">
    <polygon points="90,15 145,45 145,105 90,135 35,105 35,45"
             fill="none" stroke="url(#neonGradient)" stroke-width="2" opacity="0.4"/>
    <g filter="url(#glow)">
      <polygon points="52,110 68,110 76,94 60,94" fill="url(#neonGradient)" opacity="0.6"/>
      <polygon points="78,110 94,110 106,68 90,68" fill="url(#neonGradient)" opacity="0.85"/>
      <polygon points="104,110 120,110 138,42 122,42" fill="url(#neonGradient)"/>
    </g>
    <circle cx="126" cy="38" r="5.5" fill="#e0f2fe" filter="url(#glow)"/>
  </g>
</svg>
